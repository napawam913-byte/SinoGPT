model:
  vocab_size: 50000
  n_layer: 12
  n_head: 12
  n_embd: 768
  block_size: 1024
data:
  train_manifest: data/manifests/train.jsonl
  valid_manifest: data/manifests/validation.jsonl
  tokenizer_path: artifacts/tokenizer.json
  cache_dir: data/cache
train:
  seed: 17
  batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  max_steps: 1
  checkpoint_every: 250
  use_bf16: true
  output_dir: artifacts/ablation_125m
