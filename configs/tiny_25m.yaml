model:
  vocab_size: 50000
  n_layer: 6
  n_head: 6
  n_embd: 384
  block_size: 512
data:
  train_manifest: data/manifests/train.jsonl
  valid_manifest: data/manifests/validation.jsonl
  tokenizer_path: artifacts/tokenizer.json
  cache_dir: data/cache
train:
  seed: 17
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 0.0003
  max_steps: 1000
  checkpoint_every: 250
  use_bf16: true
  output_dir: artifacts/tiny_25m
