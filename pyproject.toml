[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sinogpt"
version = "0.1.0"
description = "从零训练的 GPT-3 风格双语语言模型教程项目"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.3",
  "tokenizers>=0.19",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "tensorboard>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
